<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t">
  <title id="t">XZZKANY 的小窝</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3f0"/>
      <stop offset=".55" stop-color="#fbe8ff"/>
      <stop offset="1" stop-color="#e3e0ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff2f8"/>
      <stop offset="1" stop-color="#ffb3d1"/>
    </linearGradient>
    <!-- 樱花瓣：底部在原点，顶端带缺口 -->
    <path id="p" d="M0,0 C-9,-5 -11,-17 -5,-23 L0,-19 L5,-23 C11,-17 9,-5 0,0Z"/>
    <path id="sp" d="M0,0 C-6.3,-3.5 -7.7,-11.9 -3.5,-16.1 L0,-13.3 L3.5,-16.1 C7.7,-11.9 6.3,-3.5 0,0Z"/>
    <g id="flower" stroke="#ff9cc5" stroke-width=".8">
      <use href="#p" fill="url(#petal)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(72)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(144)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(216)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(288)"/>
      <g stroke="none" fill="#e0457f">
        <circle cx="4.1" cy="-5.7" r="1.3"/><circle cx="6.7" cy="2.2" r="1.3"/>
        <circle cx="0" cy="7" r="1.3"/><circle cx="-6.7" cy="2.2" r="1.3"/>
        <circle cx="-4.1" cy="-5.7" r="1.3"/>
      </g>
      <circle r="3.2" fill="#ff6fa8" stroke="none"/>
    </g>
    <path id="spark" d="M0,-10 Q1,-1 10,0 Q1,1 0,10 Q-1,1 -10,0 Q-1,-1 0,-10Z"/>
    <filter id="pop" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#f39ac2"/>
    </filter>
    <clipPath id="card"><rect width="900" height="260" rx="22"/></clipPath>
  </defs>

  <style>
    .sub { font: 600 16px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c06c9a; letter-spacing: 3px; }
    .title { font: 900 66px "Arial Rounded MT Bold", "Segoe UI Black", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
             letter-spacing: 4px; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; paint-order: stroke; }
    .cn { font: 600 20px "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Noto Sans CJK SC", sans-serif; fill: #8a5a8f; }

    .fall { animation: fall 10s linear infinite; }
    .sway { animation: sway 3s ease-in-out infinite alternate; }
    .spin { animation: spin 4s linear infinite; transform-box: fill-box; transform-origin: center; }
    .tw   { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bob  { animation: bob 1.6s ease-in-out infinite alternate; }
    .shadow { animation: shadow 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .heart { animation: heart 2.6s ease-out infinite; }

    @keyframes fall {
      0%   { transform: translate(0, -24px); opacity: 0; }
      8%   { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(-90px, 285px); opacity: 0; }
    }
    @keyframes sway { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    @keyframes spin {
      0%   { transform: rotate(0deg) scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @keyframes tw { 0%, 100% { opacity: .2; transform: scale(.55); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes shadow { from { transform: scaleX(1); opacity: .35; } to { transform: scaleX(.82); opacity: .2; } }
    @keyframes heart {
      0%   { transform: translate(0, 0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translate(10px, -46px); opacity: 0; }
    }
    /* 系统关了动画时定格在飘落中途的一帧 */
    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#sky)"/>

    <!-- 光斑 -->
    <g fill="#fff">
      <circle cx="120" cy="205" r="42" opacity=".35"/>
      <circle cx="505" cy="28" r="26" opacity=".4"/>
      <circle cx="640" cy="225" r="32" opacity=".3"/>
      <circle cx="870" cy="40" r="38" opacity=".35"/>
      <circle cx="330" cy="235" r="18" opacity=".4"/>
    </g>

    <!-- 樱花枝 -->
    <g fill="none" stroke="#7b4a5c" stroke-linecap="round">
      <path d="M-20,18 C40,40 95,22 140,46 S215,78 262,66" stroke-width="8"/>
      <path d="M92,31 C104,12 124,4 150,-4" stroke-width="4"/>
      <path d="M178,60 C186,80 200,92 222,100" stroke-width="3"/>
      <path d="M40,30 C42,50 36,62 28,74" stroke-width="3"/>
    </g>
    <use href="#flower" transform="translate(18,30) rotate(10)"/>
    <use href="#flower" transform="translate(70,38) scale(.9) rotate(40)"/>
    <use href="#flower" transform="translate(122,16) scale(1.05) rotate(-15)"/>
    <use href="#flower" transform="translate(150,52) scale(.8) rotate(25)"/>
    <use href="#flower" transform="translate(205,72) scale(1.1) rotate(5)"/>
    <use href="#flower" transform="translate(255,64) scale(.75) rotate(60)"/>
    <use href="#flower" transform="translate(222,102) scale(.8) rotate(-30)"/>
    <use href="#flower" transform="translate(30,78) scale(.7) rotate(15)"/>
    <g fill="#ff8fbd">
      <circle cx="100" cy="27" r="4"/><circle cx="178" cy="60" r="3.5"/><circle cx="38" cy="58" r="3.5"/>
    </g>

    <!-- 闪光 -->
    <g transform="translate(305,48)"><use href="#spark" class="tw" fill="#ffd166"/></g>
    <g transform="translate(615,40)"><use href="#spark" class="tw" fill="#ff8fbd" style="animation-delay:-.8s"/></g>
    <g transform="translate(660,128)"><use href="#spark" class="tw" fill="#b48cff" style="animation-delay:-1.6s"/></g>
    <g transform="translate(210,190)"><use href="#spark" class="tw" fill="#b48cff" style="animation-delay:-1.1s"/></g>
    <g transform="translate(575,215)"><use href="#spark" class="tw" fill="#ffd166" style="animation-delay:-.4s"/></g>

    <!-- 标题 -->
    <text x="440" y="66" text-anchor="middle" class="sub">✿ Welcome to my little room ✿</text>
    <text x="440" y="140" text-anchor="middle" class="title" fill="url(#ink)" filter="url(#pop)">XZZKANY</text>
    <rect x="265" y="160" width="350" height="36" rx="18" fill="#fff" opacity=".7"/>
    <text x="440" y="185" text-anchor="middle" class="cn">欢迎来到我的小窝～ (｡･ω･｡)ﾉ♡</text>

    <!-- 团子猫 -->
    <ellipse cx="775" cy="238" rx="52" ry="7" fill="#c9a3dd" class="shadow"/>
    <g class="bob">
      <g fill="#fff" stroke="#f29bc1" stroke-width="3" stroke-linejoin="round">
        <path d="M728,160 L733,118 L766,140 Z"/>
        <path d="M822,160 L817,118 L784,140 Z"/>
      </g>
      <g fill="#ffc7dd">
        <path d="M735,150 L738,128 L756,141 Z"/>
        <path d="M815,150 L812,128 L794,141 Z"/>
      </g>
      <ellipse cx="775" cy="184" rx="62" ry="46" fill="#fff" stroke="#f29bc1" stroke-width="3"/>
      <g fill="none" stroke="#5a3a4a" stroke-linecap="round" stroke-linejoin="round">
        <path d="M748,180 Q755,170 762,180" stroke-width="3"/>
        <path d="M788,180 Q795,170 802,180" stroke-width="3"/>
        <path d="M767,191 Q771,197 775,191 Q779,197 783,191" stroke-width="2.2"/>
      </g>
      <g fill="#ff9ec7" opacity=".55">
        <ellipse cx="740" cy="192" rx="9" ry="5.5"/>
        <ellipse cx="810" cy="192" rx="9" ry="5.5"/>
      </g>
      <use href="#flower" transform="translate(806,146) scale(.5) rotate(20)"/>
      <text x="838" y="132" font-size="22" fill="#ff6fa8" class="heart">♡</text>
    </g>

    <!-- 飘落的花瓣 -->
    <g fill="#ffa6c9">
      <g transform="translate(40,0)"><g class="fall" style="animation-duration:9s;animation-delay:-1s"><g class="sway"><use href="#sp" class="spin"/></g></g></g>
      <g transform="translate(115,0)"><g class="fall" style="animation-duration:11s;animation-delay:-6s"><g class="sway" style="animation-duration:2.6s"><use href="#sp" class="spin" style="animation-duration:3.2s"/></g></g></g>
      <g transform="translate(190,0)"><g class="fall" style="animation-duration:8s;animation-delay:-3s"><g class="sway" style="animation-duration:3.4s"><use href="#sp" class="spin" style="animation-duration:5s"/></g></g></g>
      <g transform="translate(265,0)"><g class="fall" style="animation-duration:12s;animation-delay:-9s"><g class="sway"><use href="#sp" class="spin" fill="#ffc0da"/></g></g></g>
      <g transform="translate(340,0)"><g class="fall" style="animation-duration:9.5s;animation-delay:-4.5s"><g class="sway" style="animation-duration:2.8s"><use href="#sp" class="spin" style="animation-duration:3.6s"/></g></g></g>
      <g transform="translate(410,0)"><g class="fall" style="animation-duration:10.5s;animation-delay:-8s"><g class="sway" style="animation-duration:3.2s"><use href="#sp" class="spin" fill="#ffc0da"/></g></g></g>
      <g transform="translate(480,0)"><g class="fall" style="animation-duration:8.5s;animation-delay:-2s"><g class="sway"><use href="#sp" class="spin" style="animation-duration:4.4s"/></g></g></g>
      <g transform="translate(545,0)"><g class="fall" style="animation-duration:11.5s;animation-delay:-5s"><g class="sway" style="animation-duration:2.5s"><use href="#sp" class="spin"/></g></g></g>
      <g transform="translate(615,0)"><g class="fall" style="animation-duration:9s;animation-delay:-7s"><g class="sway" style="animation-duration:3.6s"><use href="#sp" class="spin" fill="#ffc0da" style="animation-duration:3s"/></g></g></g>
      <g transform="translate(690,0)"><g class="fall" style="animation-duration:10s;animation-delay:-.5s"><g class="sway"><use href="#sp" class="spin" style="animation-duration:4.8s"/></g></g></g>
      <g transform="translate(760,0)"><g class="fall" style="animation-duration:12.5s;animation-delay:-10s"><g class="sway" style="animation-duration:2.9s"><use href="#sp" class="spin"/></g></g></g>
      <g transform="translate(830,0)"><g class="fall" style="animation-duration:8.8s;animation-delay:-3.8s"><g class="sway" style="animation-duration:3.3s"><use href="#sp" class="spin" fill="#ffc0da" style="animation-duration:3.8s"/></g></g></g>
      <g transform="translate(900,0)"><g class="fall" style="animation-duration:10.8s;animation-delay:-6.6s"><g class="sway"><use href="#sp" class="spin"/></g></g></g>
      <g transform="translate(300,0)"><g class="fall" style="animation-duration:13s;animation-delay:-11s"><g class="sway" style="animation-duration:2.7s"><use href="#sp" class="spin" style="animation-duration:4.2s"/></g></g></g>
    </g>
  </g>
</svg>
