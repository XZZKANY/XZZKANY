name: 樱花贪吃蛇

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5fa2&color_dots=#fdf2f8,#ffd6e7,#ffadd2,#ff85c0,#eb2f96
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb3d1&color_dots=#161b22,#5c1f3d,#8f2d5c,#c9407f,#ff6fae

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
